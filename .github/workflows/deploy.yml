name: Deploy to BeamUp

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy to BeamUp via Git
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          BEAMUP_HOST: ${{ secrets.BEAMUP_HOST }}
          PROJECT_NAME: ${{ secrets.PROJECT_NAME }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          
          echo "Host *" > ~/.ssh/config
          echo "  StrictHostKeyChecking no" >> ~/.ssh/config
          echo "  UserKnownHostsFile /dev/null" >> ~/.ssh/config
          chmod 600 ~/.ssh/config

          git remote add beamup dokku@$BEAMUP_HOST:$PROJECT_NAME
          git -c core.sshCommand="ssh -i ~/.ssh/id_ed25519" push beamup HEAD:master --force
